name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: "yarn"

      - run: mv tsconfig.json tsconfig.unused

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Build
        run: yarn build
